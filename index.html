<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spy Game — выбор тематики и режимов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 20% 30%, #0b1a22, #030a0f);
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
        }

        .game-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .content-card {
            max-width: 480px;
            width: 100%;
            background: rgba(20, 30, 40, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 20px 16px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 100, 0.3);
            border: 1px solid rgba(255, 200, 100, 0.4);
            margin: auto;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #FFE6B0, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .sub {
            text-align: center;
            font-size: 0.75rem;
            color: #d4e4f0;
            margin-bottom: 20px;
        }

        .players-select, .theme-select, .mode-select {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        .player-count-btn, .theme-btn, .mode-btn {
            background: #1e2f3c;
            border: none;
            border-radius: 60px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #eef4ff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .player-count-btn.active, .theme-btn.active, .mode-btn.active {
            background: linear-gradient(135deg, #FFB347, #FF8C1A);
            color: #1a2a2f;
            box-shadow: 0 0 12px rgba(255, 140, 26, 0.6);
        }

        .name-input-area {
            text-align: center;
            margin: 20px 0;
        }

        .name-prompt {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: #FFD966;
        }

        .name-input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid #ffaa44;
            border-radius: 60px;
            padding: 14px 20px;
            font-size: 1.2rem;
            color: white;
            text-align: center;
            outline: none;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            width: 100%;
        }

        button {
            background: linear-gradient(135deg, #FFD966, #FF9F4A);
            border: none;
            border-radius: 60px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: #1e2f3a;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 5px 12px rgba(0,0,0,0.3);
            margin: 0 auto;
        }

        button:active {
            transform: scale(0.96);
        }

        .secondary-btn {
            background: rgba(255,255,245,0.15);
            color: #FFE6B0;
            border: 1px solid rgba(255,200,100,0.5);
        }

        .scene {
            width: 100%;
            height: 280px;
            perspective: 1000px;
            margin: 12px 0 8px;
            cursor: pointer;
        }

        .card-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            border-radius: 32px;
        }

        .card-3d.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .card-front {
            background: linear-gradient(145deg, #243b4a, #14222e);
            border: 2px solid #FFD966;
            transform: rotateY(0deg);
        }

        .card-back {
            background: linear-gradient(145deg, #1e4a3a, #0f2e22);
            border: 2px solid #ffaa44;
            transform: rotateY(180deg);
        }

        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .tap-hint {
            font-size: 0.7rem;
            text-align: center;
            opacity: 0.7;
            margin-top: 8px;
        }

        .player-name-badge {
            background: #ffaa44;
            display: inline-block;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: bold;
            color: #1e2f3a;
            font-size: 1.3rem;
            margin-bottom: 16px;
        }

        .game-started {
            background: linear-gradient(145deg, #1e4a3a, #0f3a2a);
            border-radius: 32px;
            padding: 32px 16px;
            text-align: center;
            border: 1px solid #ffaa44;
        }

        .result-stats {
            text-align: left;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 22px 20px;
            margin-top: 16px;
            font-size: 1rem;
            line-height: 1.6;
            color: #fff3df;
            border: 1px solid #ffcd7e;
        }

        .result-stats strong {
            color: #FFD966;
            font-size: 1.2rem;
        }

        footer {
            margin-top: 20px;
            font-size: 0.6rem;
            text-align: center;
            opacity: 0.5;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="content-card">
        <h1>⚡ SPY GAME<br>ШПИОН</h1>
        <div class="sub">нажми на карту, чтобы раскрыть роль</div>

        <!-- ЭКРАН 1: ВЫБОР КОЛИЧЕСТВА ИГРОКОВ -->
        <div id="countScreen">
            <div class="players-select" id="playersCountSelect"></div>
            <div class="button-group">
                <button id="confirmCountBtn">✅ ПОДТВЕРДИТЬ</button>
            </div>
        </div>

        <!-- ЭКРАН 2: ВЫБОР ТЕМАТИКИ -->
        <div id="themeScreen" style="display: none;">
            <div class="theme-select" id="themeSelect">
                <button data-theme="brawl" class="theme-btn active">⚡ Brawl Stars</button>
                <button data-theme="clash" class="theme-btn">🃏 Clash Royale</button>
                <button data-theme="countries" class="theme-btn">🌍 Страны</button>
                <button data-theme="cities" class="theme-btn">🏙️ Города</button>
                <button data-theme="animals" class="theme-btn">🐘 Животные</button>
                <button data-theme="movies" class="theme-btn">🎬 Фильмы</button>
                <button data-theme="professions" class="theme-btn">👨‍⚕️ Профессии</button>
            </div>
            <div class="button-group">
                <button id="confirmThemeBtn">✅ ДАЛЕЕ</button>
            </div>
        </div>

        <!-- ЭКРАН 3: ВЫБОР РЕЖИМА -->
        <div id="modeScreen" style="display: none;">
            <div class="mode-select" id="modeSelect">
                <button data-mode="classic" class="mode-btn active">🔍 Классический</button>
                <button data-mode="two_spies" class="mode-btn">👥 Два шпиона</button>
                <button data-mode="chaos" class="mode-btn">🌀 Хаос</button>
                <button data-mode="detective" class="mode-btn">🕵️ Детектив</button>
                <button data-mode="who_am_i" class="mode-btn">❓ Кто я?</button>
            </div>
            <div class="button-group">
                <button id="confirmModeBtn">✅ ДАЛЕЕ</button>
            </div>
        </div>

        <!-- ЭКРАН 4: ВВОД ИМЁН -->
        <div id="nameScreen" style="display: none;">
            <div class="name-input-area">
                <div class="name-prompt" id="namePrompt">Введите имя игрока 1</div>
                <input type="text" id="playerNameInput" class="name-input" placeholder="Имя" autocomplete="off">
            </div>
            <div class="button-group">
                <button id="nextNameBtn" class="secondary-btn">ДАЛЕЕ ▶️</button>
            </div>
        </div>

        <!-- ЭКРАН 5: ПРОСМОТР РОЛЕЙ -->
        <div id="gameScreen" style="display: none;">
            <div style="text-align: center;">
                <span class="player-name-badge" id="playerNameDisplay">Игрок</span>
            </div>
            <div class="scene" id="cardScene">
                <div class="card-3d" id="card3d">
                    <div class="card-front">
                        <div class="card-icon">❓</div>
                        <div class="card-title">ТВОЯ РОЛЬ</div>
                        <div class="card-subtitle">нажми, чтобы узнать</div>
                    </div>
                    <div class="card-back">
                        <div class="card-icon" id="roleIcon">🎭</div>
                        <div class="card-title" id="roleTitle">Слово</div>
                        <div class="card-subtitle" id="roleSubtitle">скрыто</div>
                    </div>
                </div>
            </div>
            <div class="tap-hint">👇 нажми на карточку, чтобы перевернуть</div>
            <div class="button-group" id="topButtonGroup">
                <button id="nextOrStartBtn" class="secondary-btn">СЛЕДУЮЩИЙ ▶️</button>
            </div>
            <div class="button-group" id="bottomButtonGroup">
                <button id="prevBtn" class="secondary-btn" style="display: none;">◀️ НАЗАД</button>
            </div>
        </div>

        <!-- ЭКРАН 6: ИГРА НАЧАЛАСЬ -->
        <div id="afterViewScreen" style="display: none;">
            <div class="game-started">
                <div class="card-icon" style="font-size: 3rem;">🎉</div>
                <div class="card-title" style="font-size: 1.6rem;">ИГРА НАЧАЛАСЬ!</div>
                <div class="card-subtitle" style="margin-top: 10px;">
                    Все роли просмотрены<br>Обсуждайте и найдите чужого!
                </div>
            </div>
            <div class="button-group">
                <button id="finishAfterViewBtn">🏁 ЗАВЕРШИТЬ ИГРУ</button>
            </div>
        </div>
        <footer>🎲 передавай телефон по кругу</footer>
    </div>
</div>

<script>
    // ---------- ТЕМАТИКИ (СЛОВАРИ) ----------
    const DICTIONARIES = {
        brawl: [
            "Шелли", "Нита", "Кольт", "Булл", "Брок", "Эль Примо", "Барли", "Поко", "Роза",
            "Джесси", "Динамайк", "Тик", "8-БИТ", "Рико", "Дэррил", "Пенни", "Карл", "Джеки", "Гас",
            "Бо", "Эмз", "Сту", "Пайпер", "Пэм", "Фрэнк", "Биби", "Беа", "Нани", "Эдгар", "Грифф", "Гром",
            "Мортис", "Тара", "Джин", "Макс", "Мистер П", "Спраут", "Байрон", "Скуик",
            "Спайк", "Ворон", "Леон", "Сэнди", "Амбер", "Мэг", "Гэйл", "Вольт", "Колетт", "Лу"
        ],
        clash: [
            "Принц", "Валькирия", "Волшебник", "Дракон", "Мега-рыцарь", "Ведьма", "Рыцарь", "Лучница",
            "Гигант", "Пекка", "Молния", "Король варваров", "Золотая судьба"
        ],
        countries: [
            "Франция", "Италия", "Япония", "Китай", "Бразилия", "Канада", "Австралия", "Индия",
            "Египет", "Мексика", "Германия", "Испания", "Турция", "Норвегия"
        ],
        cities: [
            "Париж", "Токио", "Лондон", "Нью-Йорк", "Москва", "Рим", "Стамбул", "Шанхай",
            "Сидней", "Берлин", "Мадрид", "Дубай"
        ],
        animals: [
            "Лев", "Слон", "Тигр", "Жираф", "Пингвин", "Дельфин", "Орёл", "Волк", "Лиса",
            "Кенгуру", "Зебра", "Коала", "Панда"
        ],
        movies: [
            "Титаник", "Аватар", "Матрица", "Индиана Джонс", "Звёздные войны", "Мстители",
            "Унесённые призраками", "Криминальное чтиво"
        ],
        professions: [
            "Врач", "Учитель", "Полицейский", "Пожарный", "Пилот", "Программист", "Художник",
            "Шеф-повар", "Фермер", "Юрист", "Инженер"
        ]
    };

    let gameState = {
        stage: 'count',
        totalPlayers: 3,
        selectedTheme: 'brawl',
        selectedMode: 'classic',
        playerNames: [],
        currentNameIndex: 0,
        currentRoleIndex: 0,
        roles: [],           // 'civil', 'different' (для who_am_i)
        roleWords: [],       // слово для каждого игрока
        differentIndex: -1,  // индекс игрока с другим словом (для who_am_i)
        commonWord: '',
        differentWord: '',
        spyIndices: [],
        detectiveIndex: -1,
        hasOpened: []
    };

    // DOM
    const countScreen = document.getElementById('countScreen');
    const themeScreen = document.getElementById('themeScreen');
    const modeScreen = document.getElementById('modeScreen');
    const nameScreen = document.getElementById('nameScreen');
    const gameScreen = document.getElementById('gameScreen');
    const afterViewScreen = document.getElementById('afterViewScreen');
    const playersCountSelect = document.getElementById('playersCountSelect');
    const confirmCountBtn = document.getElementById('confirmCountBtn');
    const themeSelectDiv = document.getElementById('themeSelect');
    const confirmThemeBtn = document.getElementById('confirmThemeBtn');
    const modeSelectDiv = document.getElementById('modeSelect');
    const confirmModeBtn = document.getElementById('confirmModeBtn');
    const namePrompt = document.getElementById('namePrompt');
    const playerNameInput = document.getElementById('playerNameInput');
    const nextNameBtn = document.getElementById('nextNameBtn');
    const playerNameDisplay = document.getElementById('playerNameDisplay');
    const card3d = document.getElementById('card3d');
    const roleIcon = document.getElementById('roleIcon');
    const roleTitle = document.getElementById('roleTitle');
    const roleSubtitle = document.getElementById('roleSubtitle');
    const prevBtn = document.getElementById('prevBtn');
    const nextOrStartBtn = document.getElementById('nextOrStartBtn');
    const finishAfterViewBtn = document.getElementById('finishAfterViewBtn');

    function renderCountSelect() {
        playersCountSelect.innerHTML = '';
        for (let i = 3; i <= 8; i++) {
            const btn = document.createElement('button');
            btn.textContent = `👥 ${i} игроков`;
            btn.classList.add('player-count-btn');
            if (gameState.totalPlayers === i) btn.classList.add('active');
            btn.onclick = () => {
                document.querySelectorAll('.player-count-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gameState.totalPlayers = i;
            };
            playersCountSelect.appendChild(btn);
        }
    }

    function setupThemeSelection() {
        const btns = document.querySelectorAll('#themeSelect .theme-btn');
        btns.forEach(btn => {
            btn.onclick = () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gameState.selectedTheme = btn.getAttribute('data-theme');
            };
        });
    }

    function setupModeSelection() {
        const btns = document.querySelectorAll('#modeSelect .mode-btn');
        btns.forEach(btn => {
            btn.onclick = () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gameState.selectedMode = btn.getAttribute('data-mode');
            };
        });
    }

    function onConfirmCount() {
        countScreen.style.display = 'none';
        themeScreen.style.display = 'block';
        setupThemeSelection();
    }

    function onConfirmTheme() {
        themeScreen.style.display = 'none';
        modeScreen.style.display = 'block';
        setupModeSelection();
    }

    function onConfirmMode() {
        startNaming();
    }

    function startNaming() {
        gameState.playerNames = [];
        gameState.currentNameIndex = 0;
        gameState.stage = 'naming';
        modeScreen.style.display = 'none';
        nameScreen.style.display = 'block';
        updateNamePrompt();
        playerNameInput.value = '';
        playerNameInput.focus();
    }

    function updateNamePrompt() {
        namePrompt.textContent = `Введите имя игрока ${gameState.currentNameIndex + 1}`;
    }

    function saveNameAndNext() {
        let name = playerNameInput.value.trim();
        if (name === '') name = `Игрок ${gameState.currentNameIndex + 1}`;
        gameState.playerNames.push(name);
        gameState.currentNameIndex++;
        if (gameState.currentNameIndex < gameState.totalPlayers) {
            updateNamePrompt();
            playerNameInput.value = '';
            playerNameInput.focus();
        } else {
            startGameAfterNaming();
        }
    }

    // --- Генерация игры ---
    function initGameLogic() {
        const num = gameState.totalPlayers;
        const dict = DICTIONARIES[gameState.selectedTheme];
        
        if (gameState.selectedMode === 'who_am_i') {
            // РЕЖИМ "КТО Я?" — чужой НЕ ЗНАЕТ, что он чужой
            let shuffled = [...dict];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            const common = shuffled[0];
            let different = shuffled[1];
            while (different === common && shuffled.length > 2) {
                different = shuffled[2];
            }
            
            const differentIndex = Math.floor(Math.random() * num);
            gameState.differentIndex = differentIndex;
            gameState.commonWord = common;
            gameState.differentWord = different;
            gameState.roleWords = [];
            
            for (let i = 0; i < num; i++) {
                if (i === differentIndex) {
                    gameState.roleWords[i] = different;
                } else {
                    gameState.roleWords[i] = common;
                }
            }
            gameState.spyIndices = [];
            gameState.detectiveIndex = -1;
        }
        else if (gameState.selectedMode === 'classic') {
            const secret = dict[Math.floor(Math.random() * dict.length)];
            const spyIdx = Math.floor(Math.random() * num);
            gameState.roleWords = [];
            for (let i = 0; i < num; i++) {
                gameState.roleWords[i] = (i === spyIdx) ? null : secret;
            }
            gameState.spyIndices = [spyIdx];
            gameState.commonWord = secret;
            gameState.differentIndex = -1;
        }
        else if (gameState.selectedMode === 'two_spies') {
            const secret = dict[Math.floor(Math.random() * dict.length)];
            let indices = [...Array(num).keys()];
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            const spyIndices = indices.slice(0, 2);
            gameState.roleWords = [];
            for (let i = 0; i < num; i++) {
                gameState.roleWords[i] = spyIndices.includes(i) ? null : secret;
            }
            gameState.spyIndices = spyIndices;
            gameState.commonWord = secret;
            gameState.differentIndex = -1;
        }
        else if (gameState.selectedMode === 'chaos') {
            const spyIdx = Math.floor(Math.random() * num);
            const civilCount = num - 1;
            const shuffled = [...dict];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            const unique = shuffled.slice(0, civilCount);
            gameState.roleWords = new Array(num);
            let civilIndex = 0;
            for (let i = 0; i < num; i++) {
                if (i === spyIdx) {
                    gameState.roleWords[i] = null;
                } else {
                    gameState.roleWords[i] = unique[civilIndex++];
                }
            }
            gameState.spyIndices = [spyIdx];
            gameState.commonWord = unique[0] || "?";
            gameState.differentIndex = -1;
        }
        else if (gameState.selectedMode === 'detective') {
            const secret = dict[Math.floor(Math.random() * dict.length)];
            let spyIdx = Math.floor(Math.random() * num);
            let detectiveIdx;
            do {
                detectiveIdx = Math.floor(Math.random() * num);
            } while (detectiveIdx === spyIdx);
            gameState.roleWords = new Array(num);
            for (let i = 0; i < num; i++) {
                gameState.roleWords[i] = secret;
            }
            gameState.roleWords[spyIdx] = null;
            gameState.spyIndices = [spyIdx];
            gameState.detectiveIndex = detectiveIdx;
            gameState.commonWord = secret;
            gameState.differentIndex = -1;
        }

        gameState.currentRoleIndex = 0;
        gameState.hasOpened = new Array(num).fill(false);
        gameState.stage = 'playing';
    }

    function startGameAfterNaming() {
        initGameLogic();
        nameScreen.style.display = 'none';
        gameScreen.style.display = 'block';
        refreshGameUI();
    }

    function updateCardBackContent() {
        const idx = gameState.currentRoleIndex;
        const word = gameState.roleWords[idx];
        const isSpy = gameState.spyIndices && gameState.spyIndices.includes(idx);
        const isDetective = (gameState.detectiveIndex === idx);
        
        if (gameState.selectedMode === 'who_am_i') {
            // Чужой НЕ ЗНАЕТ, что он чужой — просто показывает слово
            roleIcon.textContent = '🎭';
            roleTitle.textContent = word;
            roleSubtitle.textContent = 'Твоё слово';
        }
        else if (isSpy) {
            roleIcon.textContent = '🕵️‍♂️';
            roleTitle.textContent = 'ТЫ ШПИОН!';
            roleSubtitle.textContent = 'Ты не знаешь загаданного слова';
        }
        else if (isDetective) {
            roleIcon.textContent = '🔍';
            roleTitle.textContent = 'ТЫ ДЕТЕКТИВ';
            roleSubtitle.textContent = `Слово: ${word}\n\nШпион не знает слова. Задавай наводящие вопросы.`;
        }
        else {
            roleIcon.textContent = '🎭';
            roleTitle.textContent = word;
            roleSubtitle.textContent = 'Обычный игрок';
        }
    }

    function closeCardInstantly() {
        card3d.style.transition = 'none';
        card3d.classList.remove('flipped');
        void card3d.offsetHeight;
        card3d.style.transition = '';
    }

    function refreshGameUI() {
        const idx = gameState.currentRoleIndex;
        playerNameDisplay.textContent = gameState.playerNames[idx];
        closeCardInstantly();
        updateCardBackContent();

        prevBtn.style.display = (idx === 0) ? 'none' : 'inline-block';
        const isLast = (idx === gameState.totalPlayers - 1);
        if (isLast && gameState.hasOpened[idx]) {
            nextOrStartBtn.textContent = '🎲 НАЧАТЬ ИГРУ';
        } else {
            nextOrStartBtn.textContent = 'СЛЕДУЮЩИЙ ▶️';
        }
    }

    function flipCard() {
        if (gameState.stage !== 'playing') return;
        if (card3d.classList.contains('flipped')) {
            card3d.classList.remove('flipped');
        } else {
            card3d.classList.add('flipped');
            if (!gameState.hasOpened[gameState.currentRoleIndex]) {
                gameState.hasOpened[gameState.currentRoleIndex] = true;
                if (gameState.currentRoleIndex === gameState.totalPlayers - 1) {
                    nextOrStartBtn.textContent = '🎲 НАЧАТЬ ИГРУ';
                }
            }
        }
    }

    function onTopButtonClick() {
        if (gameState.stage !== 'playing') return;
        const idx = gameState.currentRoleIndex;
        const isLast = (idx === gameState.totalPlayers - 1);
        if (isLast && gameState.hasOpened[idx]) {
            showGameStartedScreen();
        } else {
            if (idx + 1 < gameState.totalPlayers) {
                gameState.currentRoleIndex++;
                refreshGameUI();
            }
        }
    }

    function showGameStartedScreen() {
        gameScreen.style.display = 'none';
        afterViewScreen.style.display = 'block';
        gameState.stage = 'after_view';
    }

    function onPrevClick() {
        if (gameState.stage !== 'playing') return;
        if (gameState.currentRoleIndex > 0) {
            gameState.currentRoleIndex--;
            refreshGameUI();
        }
    }

    function finishGame() {
        const num = gameState.totalPlayers;
        let roleNames = [];
        for (let i = 0; i < num; i++) {
            const word = gameState.roleWords[i];
            const isSpy = gameState.spyIndices && gameState.spyIndices.includes(i);
            const isDetective = (gameState.detectiveIndex === i);
            const isDifferent = (gameState.selectedMode === 'who_am_i' && i === gameState.differentIndex);
            
            if (gameState.selectedMode === 'who_am_i') {
                if (isDifferent) {
                    roleNames.push(`❓ ${word} (чужой)`);
                } else {
                    roleNames.push(word);
                }
            }
            else if (isSpy) {
                roleNames.push('ШПИОН 🕵️');
            }
            else if (isDetective) {
                roleNames.push(`ДЕТЕКТИВ (${word}) 🔍`);
            }
            else {
                roleNames.push(word);
            }
        }

        let themeTitle = '';
        switch (gameState.selectedTheme) {
            case 'brawl': themeTitle = 'Brawl Stars'; break;
            case 'clash': themeTitle = 'Clash Royale'; break;
            case 'countries': themeTitle = 'Страны'; break;
            case 'cities': themeTitle = 'Города'; break;
            case 'animals': themeTitle = 'Животные'; break;
            case 'movies': themeTitle = 'Фильмы'; break;
            case 'professions': themeTitle = 'Профессии'; break;
        }

        let modeTitle = '';
        if (gameState.selectedMode === 'classic') modeTitle = 'Классический (один шпион)';
        else if (gameState.selectedMode === 'two_spies') modeTitle = 'Два шпиона';
        else if (gameState.selectedMode === 'chaos') modeTitle = 'Хаос (разные слова)';
        else if (gameState.selectedMode === 'detective') modeTitle = 'Детектив';
        else modeTitle = 'Кто я? (один чужой, не знает о своей уникальности)';

        let statsHtml = `<div class="result-stats">
            <strong>🏆 ИТОГИ ИГРЫ 🏆</strong><br>
            🎨 Тема: ${themeTitle}<br>
            🎮 Режим: ${modeTitle}<br><br>`;
        
        if (gameState.selectedMode === 'who_am_i') {
            statsHtml += `✨ Слово большинства: <strong style="color:#FFD966;">${gameState.commonWord}</strong><br>
                         ❓ Слово чужого: <strong style="color:#FFB347;">${gameState.differentWord}</strong><br>
                         🎭 Чужой: <strong style="color:#FFB347;">${gameState.playerNames[gameState.differentIndex]}</strong><br><br>`;
        } else if (gameState.selectedMode !== 'chaos') {
            statsHtml += `✨ Загаданное слово: <strong style="color:#FFD966;">${gameState.commonWord}</strong><br>`;
            if (gameState.spyIndices && gameState.spyIndices.length) {
                statsHtml += `🕵️ Шпион(ы): <strong style="color:#FFB347;">${gameState.spyIndices.map(i => gameState.playerNames[i]).join(', ')}</strong><br>`;
            }
            if (gameState.detectiveIndex !== -1) {
                statsHtml += `🔍 Детектив: <strong style="color:#FFB347;">${gameState.playerNames[gameState.detectiveIndex]}</strong><br>`;
            }
        } else {
            statsHtml += `✨ У каждого обычного своё уникальное слово<br>`;
            if (gameState.spyIndices && gameState.spyIndices.length) {
                statsHtml += `🕵️ Шпион(ы): <strong style="color:#FFB347;">${gameState.spyIndices.map(i => gameState.playerNames[i]).join(', ')}</strong><br>`;
            }
        }
        
        statsHtml += `<br><u>Все слова игроков:</u><br>`;
        for (let i = 0; i < num; i++) {
            const displayWord = (gameState.roleWords[i] === null) ? 'ШПИОН (не знает)' : gameState.roleWords[i];
            statsHtml += `• ${gameState.playerNames[i]}: ${displayWord}<br>`;
        }
        statsHtml += `<br><button id="restartBtn">🎮 НОВАЯ ИГРА</button></div>`;
        afterViewScreen.innerHTML = statsHtml;
        const restartBtn = document.getElementById('restartBtn');
        if (restartBtn) restartBtn.addEventListener('click', () => location.reload());
        gameState.stage = 'finished';
    }

    // Обработчики
    document.getElementById('cardScene').onclick = flipCard;
    nextOrStartBtn.onclick = onTopButtonClick;
    prevBtn.onclick = onPrevClick;
    finishAfterViewBtn.onclick = finishGame;
    confirmCountBtn.onclick = onConfirmCount;
    confirmThemeBtn.onclick = onConfirmTheme;
    confirmModeBtn.onclick = onConfirmMode;
    nextNameBtn.onclick = saveNameAndNext;
    playerNameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveNameAndNext(); });

    renderCountSelect();

    if (window.Telegram && Telegram.WebApp) {
        const webApp = Telegram.WebApp;
        webApp.ready();
        webApp.expand();
        webApp.enableClosingConfirmation();
    }

    let startY = 0;
    document.body.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
    }, { passive: false });
    document.body.addEventListener('touchmove', (e) => {
        const currentY = e.touches[0].clientY;
        const delta = currentY - startY;
        if (delta > 10 && window.scrollY === 0 && !e.target.closest('.game-container')) {
            e.preventDefault();
        }
    }, { passive: false });
</script>
</body>
</html>
